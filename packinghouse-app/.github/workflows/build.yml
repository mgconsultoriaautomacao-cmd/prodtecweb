name: Build & Release Electron App

on:
  push:
    branches: [main, SISTEMA-LOCAL]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Windows Build → gera .exe (Squirrel installer)
  # ─────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Windows x64
        run: npx @electron/rebuild -f -w sqlite3 -a x64

      - name: Make Windows installer
        run: npx electron-forge make --platform win32 --arch x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/make/squirrel.windows/x64/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Linux ARM64 Build → gera .deb para Raspberry Pi 4/5
  # ─────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Build Linux ARM64 (.deb para Raspberry Pi)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            dpkg fakeroot \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libxtst-dev libpng++-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Rebuild sqlite3 for Linux ARM64
        run: npx @electron/rebuild -f -w sqlite3 -a arm64
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64

      - name: Make Linux ARM64 .deb
        run: npx electron-forge make --platform linux --arch arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-deb
          path: out/make/deb/arm64/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Release — cria GitHub Release quando há uma tag v*
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-deb
          path: dist/linux-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PRODTEC Packinghouse ${{ github.ref_name }}"
          body: |
            ## PRODTEC Packinghouse ${{ github.ref_name }}

            ### 📥 Downloads

            | Plataforma | Arquivo | Instruções |
            |---|---|---|
            | **Windows 10/11** | `.exe` | Execute o instalador. Se aparecer alerta do Windows Defender, clique em "Mais informações → Executar assim mesmo" |
            | **Raspberry Pi 4/5** | `.deb` | `sudo dpkg -i prodtec-packinghouse_*.deb` |

            > ⚠️ O app requer Python 3 instalado para o serviço de visão computacional (OCR de caixas).
          files: |
            dist/windows/*.exe
            dist/linux-arm64/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

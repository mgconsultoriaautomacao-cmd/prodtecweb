name: Build & Release Electron App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Windows Build → gera .exe (Squirrel installer)
  # ─────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: packinghouse-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native modules for Windows x64
        run: npx @electron/rebuild -f -w sqlite3

      - name: Make Windows installer (.exe NSIS)
        run: npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packinghouse-app/dist-win/*.exe
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Linux ARM64 Build → gera .deb para Raspberry Pi 4/5
  # ─────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Build Linux ARM64 (.deb para Raspberry Pi)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packinghouse-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU (para emulação ARM64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg fakeroot \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            python3 python3-pip

      - name: Install Node dependencies
        run: npm install

      - name: Rebuild sqlite3 for Linux ARM64
        run: |
          npx @electron/rebuild -f -w sqlite3 --target-arch arm64
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64

      - name: Make Linux .deb / AppImage
        run: npm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            packinghouse-app/dist-win/*.deb
            packinghouse-app/dist-win/*.AppImage
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Release — cria GitHub Release quando há uma tag v*
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PRODTEC Packinghouse ${{ github.ref_name }}"
          body: |
            ## PRODTEC Packinghouse ${{ github.ref_name }}

            ### Downloads
            - **Windows**: Instale o arquivo `.exe` (Instalador automático NSIS)
            - **Linux (Ubuntu/Debian)**: Instale o arquivo `.deb` (`sudo dpkg -i prodtec-packinghouse_*.deb`)
            - **Linux (Universal AppImage)**: Execute o arquivo `.AppImage` (`chmod +x ... && ./...AppImage`)

            > ⚠️ No Windows, se aparecer alerta de segurança, clique em "Mais informações → Executar assim mesmo".
          files: |
            dist/windows/*.exe
            dist/linux/*.deb
            dist/linux/*.AppImage
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

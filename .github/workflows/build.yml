name: Build & Release Electron App

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PRODTEC Packinghouse ${{ github.ref_name }}"
          body: |
            ## PRODTEC Packinghouse ${{ github.ref_name }}

            ### Downloads
            - **Windows**: Instale o arquivo `PRODTEC-Packinghouse-Setup-1.0.1.exe` (Instalador automático NSIS)

            > ⚠️ No Windows, se aparecer alerta de segurança, clique em "Mais informações → Executar assim mesmo".
          files: |
            PRODTEC-Packinghouse-Setup-1.0.1.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
